name: Build Android APK

# Builds an installable, debug-signed release APK for Lensii and
# publishes it to a GitHub Release so there is always a stable download link.
#
# Trigger: pushes that touch the app, or run it manually from the Actions tab.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install JS dependencies
        run: npm ci

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      # Opt-in real release signing: only decodes/exports anything when the
      # LENSII_RELEASE_KEYSTORE_BASE64 secret exists. Until it does, Gradle's
      # signingConfigs.release (see plugins/withReleaseSigning.js) stays
      # unconfigured and the release build falls back to debug signing,
      # exactly as it always has — nothing below changes that path.
      - name: Decode release keystore (if configured)
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.LENSII_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LENSII_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LENSII_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LENSII_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore secret configured — release build stays debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          echo "LENSII_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"
          echo "LENSII_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LENSII_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LENSII_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Gradle — assembleRelease
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Gradle — bundleRelease (Play Store AAB)
        working-directory: app/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/lensii.apk
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/lensii-v${{ steps.ver.outputs.version }}-${{ github.run_number }}.apk"
          ls -lh ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lensii-apk
          path: dist/*.apk
          if-no-files-found: error

      # Not published to the public GitHub Release below (an AAB isn't
      # directly installable) -- this is for pulling down and uploading to
      # Play Console once real release signing (above) is configured.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lensii-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Lensii — Android (latest)"
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            **Lensii** — latest Android build.

            - App version: `v${{ steps.ver.outputs.version }}`
            - Build: `#${{ github.run_number }}` · commit `${{ github.sha }}`
            - Debug-signed for **sideloading** (not a Play Store upload).

            ### Install on your Pixel 9 Pro
            1. Download **`lensii.apk`** below (open this page on the phone).
            2. Tap the file → allow "install unknown apps" for your browser/files app if asked.
            3. Open **Lensii**, grant camera (and mic for video).

            **Works today**
            - **Capture** — photo + video, flip, flash, torch, 0.5×–zoom, grid (thirds/golden/square), electronic level, reticle, self-timer
            - **Studio** — layer compositor (base photo + text/sticker layers, drag/scale/rotate/opacity, flatten & export)
            - **Timelapse** — intervalometer; sets play back in Library
            - **Lab** — live overlays + on-device colour-palette analysis
            - **Attachments** — device & sensor inspector
            - **Library** — photos + videos, photo editor (rotate/flip/crop), video player, timelapse playback, colour analysis, share, save-to-Photos
            - **Settings** — full customization hub (resolution, mic, video quality, defaults, storage)

            *Screen recording and manual ISO/shutter/RAW need native modules and are staged on the roadmap.*
          files: |
            dist/lensii.apk
            dist/lensii-v${{ steps.ver.outputs.version }}-${{ github.run_number }}.apk
